version: '3.9'
services:
  airflow-init:
    build: .
    environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    entrypoint: '/bin/bash -c " airflow db init && airflow users create --username
      admin --password admin --firstname Admin --lastname User --role Admin --email
      admin@example.com || true"

      '
    restart: on-failure
    networks:
    - airnet
  airflow-webserver:
    build: .
    depends_on:
    - airflow-init
    environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__WEB_SERVER_HOST=0.0.0.0
    - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
    volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    ports:
    - 8080:8080
    command: webserver
    restart: unless-stopped
    networks:
    - airnet
  airflow-scheduler:
    build: .
    depends_on:
    - airflow-init
    environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
    - airflow_data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    command: scheduler
    restart: unless-stopped
    networks:
    - airnet
  lab:
    image: jupyter/pyspark-notebook:latest
    container_name: mle-project-jupyter
    ports:
    - 8892:8892
    volumes:
    - .:/app
    working_dir: /app
    command:
    - start-notebook.sh
    - --ServerApp.ip=0.0.0.0
    - --ServerApp.port=8892
    - --ServerApp.root_dir=/app
    - --ServerApp.token=
    - --ServerApp.password=
    - --ServerApp.disable_check_xsrf=True
volumes:
  airflow_data: null
networks:
  airnet:
    driver: bridge
configs: {}
secrets: {}
