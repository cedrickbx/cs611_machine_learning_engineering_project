services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  postgres-mlflow:
    image: postgres:13
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_mlflow_data:/var/lib/postgresql/data
      # Uncomment the line below if you have initialization scripts for the mlflow database
      # - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 10s
      retries: 5

  mlflow:
    image: python:3.9-slim
    depends_on:
      postgres-mlflow:
        condition: service_healthy
    environment:
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /tmp/mlflow/artifacts
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - mlflow_data:/tmp/mlflow
      - ./scripts:/opt/airflow/scripts
    ports:
      - "5000:5000"
    command: >
      bash -c "apt-get update && apt-get install -y curl &&
      pip install mlflow psycopg2-binary &&
      mkdir -p /tmp/mlflow/artifacts &&
      chmod -R 777 /tmp/mlflow &&
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://mlflow:mlflow@postgres-mlflow:5432/mlflow --default-artifact-root /tmp/mlflow/artifacts"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__METRICS__STATSD_ON: "False"
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./datamart:/opt/airflow/datamart
      - ./data:/opt/airflow/data
      - ./data/airports:/opt/airflow/data/airports
    entrypoint:
      - /bin/bash
      - -lc
      - >
        airflow db init &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__METRICS__STATSD_ON: "False"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./datamart:/opt/airflow/datamart
      - ./data:/opt/airflow/data
      - ./data/airports:/opt/airflow/data/airports
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__METRICS__STATSD_ON: "False"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./datamart:/opt/airflow/datamart
      - ./data:/opt/airflow/data
      - ./data/airports:/opt/airflow/data/airports
    command: scheduler
    restart: unless-stopped

  lab:
    image: jupyter/pyspark-notebook:latest
    container_name: mle-project-jupyter
    ports:
      - "8892:8892"
    volumes:
      - .:/app
    working_dir: /app
    command:
      - start-notebook.sh
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8892
      - --ServerApp.root_dir=/app
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.disable_check_xsrf=True

volumes:
  postgres_data: {}
  postgres_mlflow_data: {}
  mlflow_data: {}
  airflow_data: {}